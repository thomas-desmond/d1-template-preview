name: Preview Screenshot

# Fires automatically on every PR. Does not create a Preview and needs no
# Cloudflare credentials - Workers Builds (already connected via the Deploy
# to Cloudflare button) does the actual build/deploy. This workflow derives
# the Preview URL from the branch name (Workers Builds names every Preview
# "<branch>-<worker-name>"), waits for it to come up, screenshots it, and
# posts the screenshot inline in the PR via a dedicated per-PR artifact
# branch (pattern validated against yomna-shousha/browser-run-preview-astro).
#
# We derive the URL ourselves instead of relying on the
# cloudflare-workers-and-pages bot's PR comment, which was found to be
# unreliable in testing (build/deploy consistently succeeded but the comment
# did not consistently post).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

env:
  WORKER_NAME: d1-template-preview
  ACCOUNT_SUBDOMAIN: thomas-development

jobs:
  screenshot:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive the expected Preview URL
        id: derive
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          slug=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g')
          url="https://${slug}-${WORKER_NAME}.${ACCOUNT_SUBDOMAIN}.workers.dev"
          echo "Derived Preview URL: $url"
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for the Preview to come up
        run: |
          url="${{ steps.derive.outputs.preview_url }}"
          for i in $(seq 1 18); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "Attempt $i: $status"
            if [ "$status" = "200" ]; then
              echo "Preview is up."
              exit 0
            fi
            sleep 10
          done
          echo "Preview never came up at $url after 3 minutes"
          exit 1

      - name: Install Playwright
        run: npx --yes playwright install --with-deps chromium

      - name: Screenshot the Preview
        run: npx --yes playwright screenshot "${{ steps.derive.outputs.preview_url }}" preview.png

      - name: Publish screenshot to a per-PR artifact branch
        id: publish
        env:
          ARTIFACT_BRANCH: preview-artifacts-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WORKTREE=$(mktemp -d)
          if git ls-remote --exit-code --heads origin "$ARTIFACT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$ARTIFACT_BRANCH"
            git worktree add "$WORKTREE" "origin/$ARTIFACT_BRANCH"
          else
            git worktree add --detach "$WORKTREE"
            git -C "$WORKTREE" switch --orphan "$ARTIFACT_BRANCH"
            git -C "$WORKTREE" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$WORKTREE/screenshots"
          cp preview.png "$WORKTREE/screenshots/preview.png"
          git -C "$WORKTREE" add screenshots/preview.png
          git -C "$WORKTREE" commit -m "Update screenshot for PR #${{ github.event.pull_request.number }}" || true
          git -C "$WORKTREE" push origin "HEAD:$ARTIFACT_BRANCH"

          screenshot_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ARTIFACT_BRANCH}/screenshots/preview.png?cache-bust=${GITHUB_SHA}"
          echo "screenshot_url=$screenshot_url" >> "$GITHUB_OUTPUT"

      - name: Comment on the PR (sticky)
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.derive.outputs.preview_url }}
          SCREENSHOT_URL: ${{ steps.publish.outputs.screenshot_url }}
        with:
          script: |
            const marker = '<!-- preview-screenshot -->';
            const previewUrl = process.env.PREVIEW_URL;
            const screenshotUrl = process.env.SCREENSHOT_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            const body = `${marker}
            ## 🖼️ Preview Screenshot

            [Open the Preview](${previewUrl})

            ![Preview screenshot](${screenshotUrl})

            Commit: \`${sha}\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete the per-PR artifact branch
        env:
          ARTIFACT_BRANCH: preview-artifacts-pr-${{ github.event.pull_request.number }}
        run: git push origin --delete "$ARTIFACT_BRANCH" || true
